services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailing}
      POSTGRES_USER: ${POSTGRES_USER:-mailing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailing}
    volumes:
      - mailing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailing} -d ${POSTGRES_DB:-mailing}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mailing-network]

  api:
    build: .
    ports:
      - "${PORT:-4444}:4444"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4444
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailing}:${POSTGRES_PASSWORD:-mailing}@db:5432/${POSTGRES_DB:-mailing}?schema=public
      TELEGRAM_MODE: ${TELEGRAM_MODE:-mock}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      API_KEY: ${API_KEY:-}
      QUEUE_DELAY_MS: ${QUEUE_DELAY_MS:-750}
      QUEUE_MAX_RETRIES: ${QUEUE_MAX_RETRIES:-3}
      QUEUE_RETRY_DELAY_MS: ${QUEUE_RETRY_DELAY_MS:-1000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4444}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4444/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [mailing-network]

volumes:
  mailing-postgres-data:

networks:
  mailing-network:
    driver: bridge
